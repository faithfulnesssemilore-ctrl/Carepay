services:
  - type: web
    name: fintech-app
    env: docker
    region: us-oregon
    plan: free
    dockerfilePath: Dockerfile
    startCommand: /usr/local/bin/entrypoint.sh

    # Environment variables (set these in Render dashboard or via CLI)
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stack
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        scope: build,runtime
        fromService:
          type: pserv
          name: fintech-mysql
          property: connectionString
      - key: PAYSTACK_PUBLIC_KEY
        sync: false  # Set manually in Render dashboard
      - key: PAYSTACK_SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: MAIL_MAILER
        value: smtp
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FIRST_NAME
        value: Admin
        sync: false
      - key: ADMIN_LAST_NAME
        value: User
        sync: false
      - key: ADMIN_PHONE
        value: 09000000000
        sync: false
      # Other environment variables will be set via Render dashboard

  - type: pserv
    name: fintech-mysql
    ipAllowList: []  # Restrict to web service
    plan: free
    
    # MySQL on Aiven (not managed by Render - using external)
    # Connection info from .env will be used instead
    # Uncomment below if using Render's PostgreSQL instead:
    # dbName: fintech_db
    # user: fintech_user
    # postgresMajorVersion: 15
